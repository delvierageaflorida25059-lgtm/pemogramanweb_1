<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/assets/icon-192.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keranjang - Smart Restaurant</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="appbar">
    <div class="appbar__brand">
      <span class="appbar__logo">SR</span>
      <a href="/menu.html" class="appbar__link">← Menu</a>
    </div>
    <div class="appbar__user" id="table-info"></div>
  </header>

  <main class="main">
    <div class="container">
      <div class="stack">
        <div>
          <h1>Keranjang</h1>
          <p class="muted">Periksa pesanan Anda sebelum mengirim ke dapur.</p>
        </div>

        <div class="card">
          <div class="card__body">
            <div class="cart-list" id="cart-items"></div>
          </div>
        </div>

        <div class="card">
          <div class="card__header">
            <span class="card__title">Informasi Pemesan</span>
          </div>
          <div class="card__body">
            <div class="form-row">
              <div class="field">
                <label class="label" for="customer-name">Nama (opsional)</label>
                <input class="input" type="text" id="customer-name" maxlength="100"
                       placeholder="Nama panggilan" />
              </div>
              <div class="field">
                <label class="label" for="customer-phone">Nomor HP (opsional)</label>
                <input class="input" type="tel" id="customer-phone" maxlength="30"
                       placeholder="08xxxxxxxxxx" />
              </div>
            </div>
            <div class="field">
              <label class="label" for="order-note">Catatan untuk dapur (opsional)</label>
              <textarea class="textarea" id="order-note" maxlength="500"
                        placeholder="Contoh:_level pedas, tidak pakai sambal"></textarea>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Ringkasan total, menempel di bawah pada mobile -->
  <div class="card" id="summary-panel"
       style="position: sticky; bottom: 0; border-radius: 0; border-left: none; border-right: none; border-bottom: none; z-index: 30;">
    <div class="card__body">
      <div class="cart-summary">
        <div class="cart-summary__row">
          <span>Subtotal</span>
          <span class="cart-summary__value" id="summary-subtotal">Rp 0</span>
        </div>
        <div class="cart-summary__row" id="summary-tax-row" hidden>
          <span>Pajak <span id="summary-tax-percent"></span></span>
          <span class="cart-summary__value" id="summary-tax">Rp 0</span>
        </div>
        <div class="cart-summary__row" id="summary-service-row" hidden>
          <span>Service charge <span id="summary-service-percent"></span></span>
          <span class="cart-summary__value" id="summary-service">Rp 0</span>
        </div>
        <div class="cart-summary__row cart-summary__row--total">
          <span>Total</span>
          <span class="cart-summary__value" id="summary-total">Rp 0</span>
        </div>
      </div>
      <button type="button" class="btn btn--primary btn--block btn--large"
              id="submit-button" style="margin-top: 0.75rem;" disabled>
        Kirim Pesanan
      </button>
    </div>
  </div>

  <script type="module" src="/js/cart.js"></script>
  <script src="/js/pwa.js"></script>
</body>
</html>
